<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo escuro (Slate 950 do Tailwind) -->
  <circle cx="256" cy="256" r="256" fill="#020617"/>

  <!-- Anel Externo Fino (Cyan 600) -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#0891b2" stroke-width="8"/>

  <!-- Anel Tracejado (Cyan 500) -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#06b6d4" stroke-width="24" stroke-dasharray="40 24"/>

  <!-- Linhas HUD / Mira (Cyan 400) -->
  <line x1="256" y1="20" x2="256" y2="80" stroke="#22d3ee" stroke-width="16" stroke-linecap="round"/>
  <line x1="256" y1="432" x2="256" y2="492" stroke="#22d3ee" stroke-width="16" stroke-linecap="round"/>
  <line x1="20" y1="256" x2="80" y2="256" stroke="#22d3ee" stroke-width="16" stroke-linecap="round"/>
  <line x1="432" y1="256" x2="492" y2="256" stroke="#22d3ee" stroke-width="16" stroke-linecap="round"/>

  <!-- Anel Interno Sólido (Cyan 400) -->
  <circle cx="256" cy="256" r="100" fill="none" stroke="#22d3ee" stroke-width="12" />

  <!-- Efeito de Brilho / Núcleo Central -->
  <!-- Camada 1: Aura grande e fraca -->
  <circle cx="256" cy="256" r="80" fill="#06b6d4" opacity="0.3"/>
  <!-- Camada 2: Brilho médio -->
  <circle cx="256" cy="256" r="50" fill="#22d3ee" opacity="0.6"/>
  <!-- Camada 3: Núcleo quente (Cyan 100) -->
  <circle cx="256" cy="256" r="30" fill="#cffafe" />
</svg>
