<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gradiente de energia do núcleo -->
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Base Circular Escura (Os cantos fora do r=240 ficam invisíveis) -->
  <circle cx="256" cy="256" r="240" fill="#020617" />
  
  <!-- Aura de Energia -->
  <circle cx="256" cy="256" r="240" fill="url(#auraGlow)" />
  
  <!-- Anel Externo Fino -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#0891b2" stroke-width="6" opacity="0.8" />
  
  <!-- Anel Tracejado Principal (Idêntico ao app) -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#22d3ee" stroke-width="16" stroke-dasharray="30 20" />
  
  <!-- Anel Interno Sólido -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#06b6d4" stroke-width="4" />
  
  <!-- Núcleo da Inteligência Artificial -->
  <circle cx="256" cy="256" r="50" fill="#22d3ee" />
  
  <!-- Ponto de Foco Central -->
  <circle cx="256" cy="256" r="15" fill="#ffffff" />
</svg>
